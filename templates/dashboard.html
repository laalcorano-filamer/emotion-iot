<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion IoT - Mood Dashboard</title>
<style>
  :root { --bg:#0F172A; --card:#1E293B; --text:#F1F5F9; --muted:#94A3B8; --brand:#A78BFA; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
         font-family: Inter, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  .eyebrow { color: var(--brand); font-size: 12px; font-weight: 600; letter-spacing: .08em; }
  h1 { margin: 4px 0 20px; font-size: 22px; }
  h2 { margin: 0 0 12px; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  #mood { font-size: 64px; font-weight: 600; color: var(--muted); }
  .muted { color: var(--muted); font-size: 14px; }
  #banner { border: 2px solid var(--brand); }
  .row { display: grid; grid-template-columns: 80px 1fr 44px; gap: 10px; align-items: center;
         margin: 8px 0; font-size: 14px; }
  .track { position: relative; height: 12px; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .track div { position: absolute; top: 0; bottom: 0; min-width: 2px; }
  .axis { display: flex; justify-content: space-between; margin: 0 54px 0 90px; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">EMOTION IOT</div>
  <h1>Mood Dashboard</h1>

  <div id="banner" class="card" role="alert" hidden>You seem down for a while. Want to take a break?</div>

  <section class="card">
    <h2>Current mood</h2>
    <div id="mood" aria-live="polite">Waiting...</div>
    <div id="duration" class="muted"></div>
  </section>

  <section class="card">
    <h2>Last 10 minutes</h2>
    <div id="timeline"></div>
    <div class="axis muted"><span>10 min ago</span><span>now</span></div>
  </section>

  <section class="card">
    <h2>Share of this session</h2>
    <div id="share"></div>
  </section>
</main>

<script>
const COLORS = { Happy:"#FBBF24", Sad:"#60A5FA", Angry:"#F87171", Surprised:"#F472B6", Neutral:"#94A3B8" };
const $ = id => document.getElementById(id);

// One labelled bar. parts = list of [start %, width %].
function row(mood, parts, value) {
  const bars = parts.map(([left, width]) =>
    `<div style="left:${left}%;width:${width}%;background:${COLORS[mood]}"></div>`).join("");
  return `<div class="row"><span>${mood}</span><div class="track" aria-hidden="true">${bars}</div>` +
         `<span class="muted">${value}</span></div>`;
}

function duration(seconds) {
  const s = Math.floor(seconds);
  return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${s % 60} s`;
}

function show(data) {
  $("mood").textContent = data.mood || "No face";
  $("mood").style.color = COLORS[data.mood] || "var(--muted)";
  $("duration").textContent = data.mood ? `for ${duration(data.seconds)}` : "";
  // only change it when needed, so screen readers don't repeat the alert every second
  if ($("banner").hidden === data.check_in) $("banner").hidden = !data.check_in;

  const total = Object.values(data.share).reduce((a, b) => a + b, 0);
  const moods = Object.keys(COLORS);

  $("timeline").innerHTML = moods.map(mood => {
    const mine = data.timeline.filter(s => s.mood === mood);
    const parts = mine.map(s => [100 * s.from / data.window, 100 * (s.to - s.from) / data.window]);
    const seconds = mine.reduce((a, s) => a + s.to - s.from, 0);
    return row(mood, parts, duration(seconds).replace(/ min.*/, " min"));
  }).join("");

  $("share").innerHTML = moods.map(mood => {
    const percent = total ? 100 * (data.share[mood] || 0) / total : 0;
    return row(mood, percent ? [[0, percent]] : [], `${Math.round(percent)}%`);
  }).join("");
}

async function poll() {
  try {
    const response = await fetch("/api/state", { cache: "no-store" });
    show(await response.json());
  } catch (error) {
    $("mood").textContent = "Offline";
    $("mood").style.color = "var(--muted)";
    $("duration").textContent = "The detector is not running.";
    $("banner").hidden = true;
  }
  setTimeout(poll, 1000);  // wait for one answer before asking again
}
poll();
</script>
</body>
</html>
